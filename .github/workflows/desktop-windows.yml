# デスクトップ版(Windows)を作って確かめる
#
# 作るもの: CoilCalculator.exe(成果物 "CoilCalculator-windows" から取れる)。
# 配るときは、アプリのフォルダの直下(bridge.py と同じ場所)に置く。
#
# 確かめること:
#   - Python の試験(Windows の上で。錠・標準入出力は OS で違いが出やすい)
#     ・元の JS との突き合わせ(node)も含む
#   - Python 3.8 でも動く(ラインPCの Python が古いことがある)
#   - Rust の試験
#   - 作った exe を本当に起動し、計算が Python から返ること・ポートで待ち受けないこと・
#     止めたら Python も終わること・ブラウザ版との排他(scripts/desktop_smoke.py)
#   - start.bat / stop.bat / Start.vbs を本当に動かす(tests/test_launch_windows.py)
#   - 業務ツール統合ランチャー(python-business-tools-launcher)の本体のコードで、
#     登録の読み取り・起動確認・停止(stop.bat / 停止要求)を確かめる(tests/test_launcher.py・desktop_smoke)
#   - 配布フォルダ(scripts/make_dist.py)を exe 入りで作り、その start.bat --check が通る
#     → 成果物 "CoilCalculator-dist"(そのまま配れるフォルダ)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  python-old:
    # 追加のパッケージは入れない(ラインPCと同じ。標準ライブラリだけで通ること)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Python 3.8 の試験
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ランチャーはこのツールの外に取ってくる(ツールの直下に置くと配布フォルダの検査に引っかかる)
      - name: 業務ツール統合ランチャーを取ってくる
        run: git clone --depth 1 https://github.com/ViVio-Hellon/python-business-tools-launcher "${{ runner.temp }}/launcher"

      - name: Python の試験(pip install は要らない)
        env:
          PYTHONIOENCODING: utf-8
          LAUNCHER_REPO: ${{ runner.temp }}/launcher
        run: python -m unittest discover -s tests -t . -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        env:
          PYTHONIOENCODING: utf-8
          LAUNCHER_REPO: ${{ runner.temp }}/launcher
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/CoilCalculator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CoilCalculator-windows
          path: src-tauri/target/release/CoilCalculator.exe
          if-no-files-found: error

      # 配布フォルダ(scripts/make_dist.py)を、いま作った exe 入りで作る。
      # できたフォルダの start.bat --check が通ることまで確かめる
      - name: 配布フォルダを作る
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/make_dist.py --out "${{ runner.temp }}/CoilCalculator-dist" --exe src-tauri/target/release/CoilCalculator.exe

      - name: 配布フォルダの start.bat で確かめる
        shell: cmd
        env:
          COIL_TOOL_LOCAL_DIR: ${{ runner.temp }}\dist-check
        run: |
          cd /d "${{ runner.temp }}\CoilCalculator-dist"
          call start.bat --check < nul

      - uses: actions/upload-artifact@v4
        with:
          name: CoilCalculator-dist
          path: ${{ runner.temp }}/CoilCalculator-dist
          if-no-files-found: error

      # 配った先ですること: scripts\make_shortcuts.vbs を押すと、ツールのフォルダにショートカットが2つできる。
      # 成果物を上げたあとに流す(配布物にショートカットを混ぜない。指す先がこの機械の場所になるため)
      - name: 配布フォルダで scripts\make_shortcuts.vbs を押す
        shell: cmd
        run: |
          cd /d "${{ runner.temp }}\CoilCalculator-dist"
          cscript //nologo scripts\make_shortcuts.vbs
          if errorlevel 1 exit /b 1
          dir /b *.lnk
          for /f %%n in ('dir /b *.lnk ^| find /c /v ""') do if not "%%n"=="2" (echo expected 2 shortcuts & exit /b 1)
