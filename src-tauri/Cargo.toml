# デスクトップ版の外枠(Rust/Tauri)。計算は Python(`bridge.py`)が持つ。
# ここが持つのは: 窓・画面のファイルを返す・Python の起動と監視・
# 多重起動の防止・ブラウザ版との排他。詳しくは docs/デスクトップ版.md
[package]
name = "coil-calculator-desktop"
version = "2.3.0"
edition = "2021"
# File::try_lock(ブラウザ版との排他)を使うので 1.89 以上
rust-version = "1.89"
publish = false

[[bin]]
name = "CoilCalculator"
path = "src/main.rs"

[features]
# `cargo build --release` だけで配れる exe にする(Tauri の作法)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
